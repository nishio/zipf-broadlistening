<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>1%意見の取りこぼし体験</title>
    <style>
      :root {
        --bg0: #f6efe3;
        --bg1: #eee3d3;
        --ink: #182021;
        --muted: #5d5a52;
        --card: rgba(255, 255, 255, 0.72);
        --card-border: rgba(8, 12, 16, 0.12);
        --shadow: rgba(0, 0, 0, 0.08);
        --accent: #0e6f63;
        --accent-2: #c05f2f;
        --x: #b4382d;
        --dot: #cfc8b8;
        --font-main: "Hiragino Mincho ProN", "Yu Mincho", "BIZ UDPMincho", Georgia, serif;
        --font-mono: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        color: var(--ink);
        font-family: var(--font-main);
        background:
          radial-gradient(900px 560px at 12% -20%, rgba(14, 111, 99, 0.18), transparent 60%),
          radial-gradient(680px 460px at 110% 10%, rgba(192, 95, 47, 0.15), transparent 58%),
          linear-gradient(180deg, var(--bg0), var(--bg1));
      }

      .page {
        max-width: 1100px;
        margin: 0 auto;
        padding: 24px 18px 42px;
      }

      /* ---- hero (slide) ---- */
      .slide {
        min-height: 92vh;
        display: flex;
        flex-direction: column;
        justify-content: center;
        gap: 16px;
      }

      .kicker {
        font-size: 13px;
        letter-spacing: 2.4px;
        text-transform: uppercase;
        color: var(--accent);
      }

      h1 {
        margin: 0;
        font-size: clamp(26px, 4vw, 44px);
        line-height: 1.3;
        letter-spacing: 0.4px;
        max-width: 24em;
      }

      .lede {
        margin: 0;
        max-width: 62ch;
        font-size: clamp(14px, 1.6vw, 17px);
        line-height: 1.7;
        color: var(--muted);
      }

      .hero-grid {
        display: grid;
        grid-template-columns: minmax(0, 1.5fr) minmax(260px, 1fr);
        gap: 16px;
        align-items: stretch;
      }

      .card {
        background: var(--card);
        border: 1px solid var(--card-border);
        border-radius: 16px;
        box-shadow: 0 14px 32px var(--shadow);
        backdrop-filter: blur(6px);
      }

      .viz {
        padding: 14px;
        display: flex;
        flex-direction: column;
        gap: 10px;
      }

      .viz canvas {
        width: 100%;
        height: auto;
        display: block;
        border-radius: 10px;
      }

      .legend {
        display: flex;
        flex-wrap: wrap;
        gap: 14px;
        font-size: 12.5px;
        color: var(--muted);
      }

      .legend .item {
        display: inline-flex;
        align-items: center;
        gap: 6px;
      }

      .swatch {
        width: 10px;
        height: 10px;
        border-radius: 50%;
        display: inline-block;
      }

      .swatch.all { background: var(--dot); }
      .swatch.x { background: var(--x); }
      .swatch.sampled { background: var(--ink); }

      .panel {
        padding: 18px;
        display: flex;
        flex-direction: column;
        gap: 12px;
        justify-content: center;
      }

      .big-stat .num {
        font-family: var(--font-mono);
        font-size: clamp(44px, 6vw, 68px);
        line-height: 1;
        color: var(--x);
      }

      .big-stat .caption {
        margin-top: 6px;
        font-size: 13.5px;
        color: var(--muted);
        line-height: 1.5;
      }

      .verdict {
        min-height: 3em;
        font-size: 15px;
        line-height: 1.5;
        border-left: 3px solid var(--card-border);
        padding-left: 10px;
      }

      .verdict.miss {
        border-left-color: var(--x);
        color: var(--x);
      }

      .verdict.hit {
        border-left-color: var(--accent);
        color: var(--accent);
      }

      .tally {
        font-family: var(--font-mono);
        font-size: 13px;
        color: var(--muted);
      }

      .action-row {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        align-items: center;
      }

      .btn {
        appearance: none;
        border: 1px solid rgba(14, 111, 99, 0.55);
        background: rgba(14, 111, 99, 0.1);
        color: var(--accent);
        font-family: inherit;
        font-size: 13.5px;
        padding: 8px 12px;
        border-radius: 999px;
        cursor: pointer;
      }

      .btn:hover {
        background: rgba(14, 111, 99, 0.18);
      }

      .btn.secondary {
        border-color: var(--card-border);
        background: rgba(255, 255, 255, 0.5);
        color: var(--muted);
      }

      .cta {
        display: inline-block;
        align-self: flex-start;
        margin-top: 4px;
        font-size: 15px;
        color: var(--accent-2);
        text-decoration: none;
        border-bottom: 1px dashed var(--accent-2);
      }

      .cta:hover {
        border-bottom-style: solid;
      }

      .scroll-hint {
        text-align: center;
        color: var(--muted);
        font-size: 12.5px;
        letter-spacing: 1.5px;
      }

      /* ---- explanation ---- */
      .explain {
        margin-top: 40px;
        display: grid;
        gap: 14px;
      }

      .section {
        padding: 20px;
      }

      .section h2 {
        margin: 0 0 10px;
        font-size: 19px;
        letter-spacing: 0.4px;
      }

      .section p {
        margin: 0 0 10px;
        max-width: 74ch;
        font-size: 15px;
        line-height: 1.8;
      }

      .section p:last-child {
        margin-bottom: 0;
      }

      .formula {
        font-family: var(--font-mono);
        font-size: 14px;
        background: rgba(255, 255, 255, 0.6);
        border: 1px solid var(--card-border);
        border-radius: 8px;
        padding: 8px 12px;
        display: inline-block;
        margin: 4px 0 10px;
      }

      .table-wrap {
        overflow-x: auto;
      }

      table {
        border-collapse: collapse;
        font-family: var(--font-mono);
        font-size: 13px;
        margin: 6px 0 4px;
      }

      th, td {
        border: 1px solid var(--card-border);
        padding: 6px 12px;
        text-align: right;
        white-space: nowrap;
      }

      th {
        background: rgba(255, 255, 255, 0.55);
        font-weight: normal;
        color: var(--muted);
      }

      td.danger { color: var(--x); }

      .table-note {
        font-size: 12.5px;
        color: var(--muted);
        margin-top: 4px;
      }

      .cta-row {
        display: flex;
        flex-wrap: wrap;
        gap: 18px;
        align-items: baseline;
      }

      footer {
        margin-top: 30px;
        font-size: 12.5px;
        color: var(--muted);
        text-align: center;
      }

      footer a {
        color: var(--muted);
      }

      @media (max-width: 760px) {
        .hero-grid {
          grid-template-columns: 1fr;
        }
        .slide {
          min-height: 0;
        }
      }
    </style>
  </head>
  <body>
    <div class="page">
      <section class="slide">
        <div>
          <div class="kicker" id="kicker"></div>
          <h1 id="headline"></h1>
        </div>
        <p class="lede" id="lede"></p>

        <div class="hero-grid">
          <div class="card viz">
            <canvas id="dots" width="750" height="480"></canvas>
            <div class="legend">
              <span class="item"><span class="swatch all"></span><span id="legendAll"></span></span>
              <span class="item"><span class="swatch x"></span><span id="legendX"></span></span>
              <span class="item"><span class="swatch sampled"></span><span id="legendSampled"></span></span>
            </div>
          </div>

          <div class="card panel">
            <div class="big-stat">
              <div class="num" id="statNum"></div>
              <div class="caption" id="statCaption"></div>
            </div>
            <div class="verdict" id="verdict"></div>
            <div class="tally" id="tally"></div>
            <div class="action-row">
              <button class="btn" id="onceBtn"></button>
              <button class="btn secondary" id="manyBtn"></button>
            </div>
            <a class="cta" id="ctaPlayground" href="./playground.html"></a>
          </div>
        </div>

        <div class="scroll-hint" id="scrollHint"></div>
      </section>

      <div class="explain">
        <section class="card section">
          <h2 id="whatTitle"></h2>
          <p id="whatBody1"></p>
          <p id="whatBody2"></p>
        </section>

        <section class="card section">
          <h2 id="whyTitle"></h2>
          <p id="whyBody1"></p>
          <div class="formula">P_miss &asymp; exp(&minus;K &middot; p)&nbsp;&nbsp;(p = n_X / N)</div>
          <div class="table-wrap">
            <table id="missTable"></table>
          </div>
          <div class="table-note" id="tableNote"></div>
          <p id="whyBody2"></p>
        </section>

        <section class="card section">
          <h2 id="fixTitle"></h2>
          <p id="fixBody1"></p>
          <p id="fixBody2"></p>
        </section>

        <section class="card section">
          <div class="cta-row">
            <a class="cta" id="ctaPlayground2" href="./playground.html"></a>
          </div>
        </section>
      </div>

      <footer>
        <a href="https://github.com/nishio/zipf-broadlistening" id="repoLink"></a>
      </footer>
    </div>

    <script id="fallback-content" type="application/json">
      {
        "title": "1%意見の取りこぼし体験",
        "kicker": "ブロードリスニングの数理",
        "headline": "ランダムに読むと、1%の意見は3回に1回まるごと消える",
        "lede": "ここに10,000件の声がある。そのうち100件(1%)は意見Xだ。あなたが100件だけランダムに選んで読むとき、意見Xに1件も出会えない確率は約36%ある。",
        "legend": {
          "all": "すべての声 (10,000件)",
          "x": "意見X (100件 = 1%)",
          "sampled": "ランダムに読んだ100件"
        },
        "stat": {
          "caption": "意見Xを1件も読めない確率 (理論値)",
          "verdict_hit": "今回の100件には意見Xが{hits}件入っていた",
          "verdict_miss": "今回の100件に意見Xは1件もなかった",
          "tally": "実測: {runs}回読んで、{miss}回は1件も出会えなかった ({pct})"
        },
        "buttons": {
          "once": "もう一度100件読む",
          "many": "まとめて100回試す"
        },
        "cta": {
          "playground": "パラメータを変えて試す →"
        },
        "scroll_hint": "▼ この図の意味",
        "explain": {
          "what_title": "この図は何を見ているか",
          "what_body1": "灰色の点の一つひとつが、パブリックコメントやアンケート自由回答のような「声」1件。赤い点が、全体の1%にあたる意見X。黒い点が、ランダムに選んで実際に読んだ100件。",
          "what_body2": "黒い点が赤い点に1つも重ならなかった回は、読み手にとって意見Xは「存在しなかった」ことになる。上のボタンで何度でも引き直せる。3回に1回くらいの頻度で、100人分の声がまるごと視界から消える。",
          "why_title": "なぜ見落とすのか",
          "why_body1": "割合pの意見をK件のランダムサンプルで1件も引けない確率は、およそ次の式で決まる。",
          "why_body2": "意見が小さいほど、そして読む件数が少ないほど、見落とし確率は指数的に1に近づく。実際の意見分布はZipf的なロングテール(少数の多数派+大量の小さな意見)なので、ランダムサンプリングは構造的に多数派へ偏る。",
          "table_header_p": "意見の割合 p",
          "table_note": "見落とし確率 P_miss ≈ exp(−K·p)。0.1%の意見はK=100でも9割見落とす。",
          "fix_title": "どうすれば埋没しないのか",
          "fix_body1": "AIで全件を読み、似た意見をクラスタにまとめてから「クラスタの代表」を観察すると、観察単位が「件数比例」から「意見クラスタ単位」に変わる。件数がN/K以上あるクラスタは、頻度上位K個の中に必ず入る。",
          "fix_body2": "これがブロードリスニング(AI要約による全件傾聴)の数理的な意味だ。要約が効くのは情報圧縮そのものではなく、マイノリティ意見を確率まかせにしない観察配分を選べるようになるから。下のページで、母集団・サンプル数・意見の割合を変えて確かめられる。"
        },
        "footer_repo": "GitHub: nishio/zipf-broadlistening"
      }
    </script>

    <script>
      "use strict";

      const HERO = Object.freeze({
        N: 10000,
        NX: 100,
        K: 100,
        COLS: 125,
        ROWS: 80,
        CANVAS_W: 750,
        CANVAS_H: 480,
        TABLE_PS: [0.01, 0.001, 0.0001],
        TABLE_KS: [25, 100, 500, 1000],
        CONTENT_PATH: "content/ja_landing.json",
      });

      const dom = {};
      for (const id of [
        "kicker", "headline", "lede",
        "legendAll", "legendX", "legendSampled",
        "statNum", "statCaption", "verdict", "tally",
        "onceBtn", "manyBtn", "ctaPlayground", "ctaPlayground2", "scrollHint",
        "whatTitle", "whatBody1", "whatBody2",
        "whyTitle", "whyBody1", "whyBody2", "missTable", "tableNote",
        "fixTitle", "fixBody1", "fixBody2",
        "repoLink", "dots",
      ]) {
        dom[id] = document.getElementById(id);
      }

      function tpl(text, vars) {
        return text.replace(/\{(\w+)\}/g, (match, key) => (key in vars ? String(vars[key]) : match));
      }

      function fallbackContent() {
        return JSON.parse(document.getElementById("fallback-content").textContent);
      }

      async function loadContent() {
        try {
          const res = await fetch(HERO.CONTENT_PATH, { cache: "no-store" });
          if (!res.ok) throw new Error(`HTTP ${res.status}`);
          return await res.json();
        } catch (_err) {
          return fallbackContent();
        }
      }

      function exactMissRate() {
        let miss = 1;
        for (let i = 0; i < HERO.K; i++) {
          miss *= (HERO.N - HERO.NX - i) / (HERO.N - i);
        }
        return miss;
      }

      // ---- dot field ----
      const xSet = new Set();
      {
        const idx = [...Array(HERO.N).keys()];
        for (let i = idx.length - 1; i > 0; i--) {
          const j = Math.floor(Math.random() * (i + 1));
          [idx[i], idx[j]] = [idx[j], idx[i]];
        }
        for (let i = 0; i < HERO.NX; i++) xSet.add(idx[i]);
      }

      const ctx = dom.dots.getContext("2d");
      const dpr = Math.min(window.devicePixelRatio || 1, 2);
      dom.dots.width = HERO.CANVAS_W * dpr;
      dom.dots.height = HERO.CANVAS_H * dpr;
      ctx.scale(dpr, dpr);

      const pitchX = HERO.CANVAS_W / HERO.COLS;
      const pitchY = HERO.CANVAS_H / HERO.ROWS;

      function dotPos(i) {
        const col = i % HERO.COLS;
        const row = Math.floor(i / HERO.COLS);
        return { x: (col + 0.5) * pitchX, y: (row + 0.5) * pitchY };
      }

      function drawDot(i, style) {
        const { x, y } = dotPos(i);
        ctx.beginPath();
        if (style === "sampledX") {
          ctx.fillStyle = "#b4382d";
          ctx.arc(x, y, 3.4, 0, Math.PI * 2);
          ctx.fill();
          ctx.beginPath();
          ctx.strokeStyle = "#182021";
          ctx.lineWidth = 1.4;
          ctx.arc(x, y, 5.0, 0, Math.PI * 2);
          ctx.stroke();
          return;
        }
        if (style === "sampled") {
          ctx.fillStyle = "#182021";
          ctx.arc(x, y, 2.4, 0, Math.PI * 2);
          ctx.fill();
          return;
        }
        ctx.fillStyle = style === "x" ? "#b4382d" : "#cfc8b8";
        ctx.arc(x, y, style === "x" ? 2.2 : 1.7, 0, Math.PI * 2);
        ctx.fill();
      }

      function drawBase() {
        ctx.clearRect(0, 0, HERO.CANVAS_W, HERO.CANVAS_H);
        for (let i = 0; i < HERO.N; i++) {
          drawDot(i, xSet.has(i) ? "x" : "base");
        }
      }

      function pickSample() {
        const chosen = new Set();
        while (chosen.size < HERO.K) {
          chosen.add(Math.floor(Math.random() * HERO.N));
        }
        return [...chosen];
      }

      // ---- state ----
      let content = null;
      let runs = 0;
      let misses = 0;
      let animating = false;

      function renderTally() {
        if (runs === 0) {
          dom.tally.textContent = "";
          return;
        }
        dom.tally.textContent = tpl(content.stat.tally, {
          runs,
          miss: misses,
          pct: `${((misses / runs) * 100).toFixed(0)}%`,
        });
      }

      function renderVerdict(hits) {
        if (hits === 0) {
          dom.verdict.className = "verdict miss";
          dom.verdict.textContent = content.stat.verdict_miss;
        } else {
          dom.verdict.className = "verdict hit";
          dom.verdict.textContent = tpl(content.stat.verdict_hit, { hits });
        }
      }

      function sampleOnce() {
        if (animating) return;
        animating = true;
        drawBase();
        dom.verdict.className = "verdict";
        dom.verdict.textContent = "";

        const sample = pickSample();
        const hits = sample.filter((i) => xSet.has(i)).length;
        let cursor = 0;

        function step() {
          const batch = 6;
          for (let b = 0; b < batch && cursor < sample.length; b++, cursor++) {
            const i = sample[cursor];
            drawDot(i, xSet.has(i) ? "sampledX" : "sampled");
          }
          if (cursor < sample.length) {
            requestAnimationFrame(step);
          } else {
            runs += 1;
            if (hits === 0) misses += 1;
            renderVerdict(hits);
            renderTally();
            animating = false;
          }
        }
        requestAnimationFrame(step);
      }

      function runMany() {
        if (animating) return;
        let lastSample = null;
        for (let t = 0; t < 100; t++) {
          const sample = pickSample();
          const hits = sample.filter((i) => xSet.has(i)).length;
          runs += 1;
          if (hits === 0) misses += 1;
          lastSample = { sample, hits };
        }
        drawBase();
        for (const i of lastSample.sample) {
          drawDot(i, xSet.has(i) ? "sampledX" : "sampled");
        }
        renderVerdict(lastSample.hits);
        renderTally();
      }

      function buildTable() {
        const fmtP = (p) => `${parseFloat((p * 100).toFixed(2))}%`;
        let html = `<tr><th>${content.explain.table_header_p}</th>`;
        for (const k of HERO.TABLE_KS) html += `<th>K=${k}</th>`;
        html += "</tr>";
        for (const p of HERO.TABLE_PS) {
          html += `<tr><th>${fmtP(p)}</th>`;
          for (const k of HERO.TABLE_KS) {
            const miss = Math.exp(-k * p);
            const cls = miss >= 0.5 ? ' class="danger"' : "";
            html += `<td${cls}>${(miss * 100).toFixed(1)}%</td>`;
          }
          html += "</tr>";
        }
        dom.missTable.innerHTML = html;
      }

      function applyContent(c) {
        document.title = c.title;
        dom.kicker.textContent = c.kicker;
        dom.headline.textContent = c.headline;
        dom.lede.textContent = c.lede;

        dom.legendAll.textContent = c.legend.all;
        dom.legendX.textContent = c.legend.x;
        dom.legendSampled.textContent = c.legend.sampled;

        dom.statNum.textContent = `${(exactMissRate() * 100).toFixed(1)}%`;
        dom.statCaption.textContent = c.stat.caption;

        dom.onceBtn.textContent = c.buttons.once;
        dom.manyBtn.textContent = c.buttons.many;
        dom.ctaPlayground.textContent = c.cta.playground;
        dom.ctaPlayground2.textContent = c.cta.playground;
        dom.scrollHint.textContent = c.scroll_hint;

        dom.whatTitle.textContent = c.explain.what_title;
        dom.whatBody1.textContent = c.explain.what_body1;
        dom.whatBody2.textContent = c.explain.what_body2;
        dom.whyTitle.textContent = c.explain.why_title;
        dom.whyBody1.textContent = c.explain.why_body1;
        dom.whyBody2.textContent = c.explain.why_body2;
        dom.tableNote.textContent = c.explain.table_note;
        dom.fixTitle.textContent = c.explain.fix_title;
        dom.fixBody1.textContent = c.explain.fix_body1;
        dom.fixBody2.textContent = c.explain.fix_body2;

        dom.repoLink.textContent = c.footer_repo;
      }

      async function main() {
        content = await loadContent();
        applyContent(content);
        buildTable();
        drawBase();
        dom.onceBtn.addEventListener("click", sampleOnce);
        dom.manyBtn.addEventListener("click", runMany);
        sampleOnce();
      }

      main();
    </script>
  </body>
</html>
